<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>PCS 문서</title>
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--ink:#16202A;--mute:#5A6672;--line:#D6DDE4;--a:#2F5B8A;--b:#0E8576;
  --f:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#11161C;--card:#192029;--ink:#E5EAF0;--mute:#9BA7B3;--line:#2B3541;--a:#7EA6D4;--b:#3CC2AE;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);line-height:1.6;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:24px}
p{margin:0;color:var(--mute);font-size:14px}
a.card{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:16px 18px}
a.card b{font-size:18px}
a.card span{font-size:14px;color:var(--mute)}
a.card:active{transform:scale(.99)}
</style>
<main>
  <h1>PCS 문서</h1>
  <p>토레스 EVX · Passenger Care Service</p>
  <a class="card" href="work-order/" style="--c:var(--a)"><b>차량 작업지시서 →</b><span>3D 배치도에서 부품을 누르면 연결할 선과 할 일이 나옵니다</span></a>
  <a class="card" href="wiring/" style="--c:var(--b)"><b>핀맵·배선도 →</b><span>보드별 핀 배치와 배선 (내부 공유용)</span></a>
  <p>3D 화면은 인터넷 연결이 필요합니다.</p>
</main>
