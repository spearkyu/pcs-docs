<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}img{max-width:100%}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCS 차량 작업지시서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 맨 위 가로 한 줄 3D 차량 → 부품 칩 → 선택한 부품의 "연결할 선 / 할 일" 카드. 무엇을 누르든 아래 카드 하나만 바뀜 */
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#16202A; --mute:#5A6672; --line:#D6DDE4; --line-strong:#9AA7B4;
  --car:#E6EBF0; --car-2:#D5DDE5; --glass:#C9DCEB; --whl:#3A444F; --stage:#E9EEF2;
  --ours:#D9480F; --ours-bg:#FFF1E8;
  --w1:#6741D9; --w2:#2F5B8A; --w3:#0E8576; --w4:#B7791F; --unit:#6B7785; --tbd:#8794A1;
  --sig:#1C7ED6; --pwr:#E03131; --net:#7048E8; --gnd:#2B2F33;
  --wy:#E8B10E; --wk:#1E1E1E; --wr:#D9362B; --wb:#2463D1; --wr2:#F2B5B0; --wb2:#AFC6F0;
  --pcb:#1F3A2E; --relay:#2F6FD6; --hub:#4B5563;
  --warn-bg:#FFF6DB; --warn-ink:#7A5200; --hl:#F59F00;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --card:#192029; --ink:#E5EAF0; --mute:#9BA7B3; --line:#2B3541; --line-strong:#4D5A68;
  --car:#232C36; --car-2:#2C3743; --glass:#2E4558; --whl:#0B0F13; --stage:#151B22;
  --ours:#FF8A4C; --ours-bg:#2E1E14;
  --w1:#9D85F2; --w2:#7EA6D4; --w3:#3CC2AE; --w4:#E2AA4E; --unit:#8D99A6; --tbd:#7D8A97;
  --sig:#4DABF7; --pwr:#FF6B6B; --net:#9775FA; --gnd:#C9CED4;
  --wy:#F2C230; --wk:#0A0A0A; --wr:#F0524A; --wb:#4C8DF6; --wr2:#F7B9B4; --wb2:#B6CEF8;
  --pcb:#3D7A5E; --relay:#4C8DF6; --hub:#8A96A3;
  --warn-bg:#2E2610; --warn-ink:#F2C94C; --hl:#FFC145; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --card:#192029; --ink:#E5EAF0; --mute:#9BA7B3; --line:#2B3541; --line-strong:#4D5A68;
  --car:#232C36; --car-2:#2C3743; --glass:#2E4558; --whl:#0B0F13; --stage:#151B22;
  --ours:#FF8A4C; --ours-bg:#2E1E14;
  --w1:#9D85F2; --w2:#7EA6D4; --w3:#3CC2AE; --w4:#E2AA4E; --unit:#8D99A6; --tbd:#7D8A97;
  --sig:#4DABF7; --pwr:#FF6B6B; --net:#9775FA; --gnd:#C9CED4;
  --wy:#F2C230; --wk:#0A0A0A; --wr:#F0524A; --wb:#4C8DF6; --wr2:#F7B9B4; --wb2:#B6CEF8;
  --pcb:#3D7A5E; --relay:#4C8DF6; --hub:#8A96A3;
  --warn-bg:#2E2610; --warn-ink:#F2C94C; --hl:#FFC145; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(21px,3vw,28px);font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
small{font-size:13px}

.top{padding-block:16px 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.top .t{display:grid;gap:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px}
.meta b{color:var(--mute);font-weight:500;margin-right:6px}
.blank{display:inline-block;min-width:7em;border-bottom:1px solid var(--line-strong);height:1.1em;vertical-align:bottom}

/* 3D 무대 */
.stagebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sp{flex:1 1 auto}
.vbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;min-height:34px}
.vbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stage{position:relative;border-radius:10px;background:linear-gradient(#dfe5ea,#c9d0d6);overflow:hidden;height:clamp(320px,52vw,620px)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.tip{position:absolute;z-index:3;max-width:280px;background:rgba(22,32,42,.92);color:#fff;font-size:12.5px;line-height:1.4;padding:6px 10px;border-radius:8px;pointer-events:none}
.stage .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--mute);pointer-events:none;background:var(--stage);padding:0 4px;border-radius:4px}
.zoom{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);font-size:20px;line-height:1}
.selbar{position:absolute;left:8px;top:8px;right:60px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.selbar .pill{pointer-events:auto;background:var(--card);border:1.5px solid var(--c,var(--line-strong));border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.selbar .pill b{color:var(--c)}
.fallback2d{display:none}
.no3d .stage{display:none}
.no3d .fallback2d{display:block}
.no3d .toolbar .vbtn{display:none}
.fallback2d svg{display:block;width:100%;height:auto}

/* 부품 칩 */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:500;min-height:36px;white-space:nowrap}
.chip .num{width:26px;height:26px}
.chip .cnt{font:500 11px var(--f-mono);color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:var(--card)}
.chip[aria-pressed="true"] .num{background:var(--card);color:var(--c)}
.chip[aria-pressed="true"] .cnt{color:var(--card)}
.chip.all{padding-left:12px}
.chip.grp{border-style:dashed}
.num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:var(--card);font:600 12px/1 var(--f-mono)}
.num.tbd{background:transparent;color:var(--tbd);border:1.5px dashed var(--tbd)}
.num.unit{border-radius:6px;width:auto;padding:0 6px;font-size:11px}

/* 상세 카드 */
.detail{margin-top:12px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c,var(--ink));border-radius:14px;scroll-margin-top:12px}
.d-head{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.d-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-title .num{width:32px;height:32px;font-size:15px}
.grp-tag{font:600 12px var(--f-mono);color:var(--c)}
.where{display:flex;gap:6px;align-items:flex-start;color:var(--mute);font-size:14px}
.big-note{font-size:16px;font-weight:600;border-left:4px solid var(--c);padding:2px 0 2px 12px}
.d-body{padding:14px 18px 18px;display:grid;gap:16px}
.d-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.blk{display:grid;gap:8px;align-content:start;min-width:0}
.blk-h{font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.blk-h::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--ink)}
.blk.ours{background:var(--ours-bg);border-radius:10px;padding:12px 14px}
.blk.ours .blk-h{color:var(--ours)}
.blk.ours .blk-h::before{background:var(--ours)}
.plain{margin:0;padding-left:18px;display:grid;gap:4px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo li{display:flex;gap:10px;align-items:flex-start;min-height:30px}
.todo input{flex:0 0 auto;width:20px;height:20px;margin:2px 0 0;accent-color:var(--c,var(--ink))}
.todo label{cursor:pointer;-webkit-tap-highlight-color:transparent}
.todo li.done label{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.warn ul{margin:0;padding-left:18px;color:var(--ink)}

/* 선 카드 */
.wires{display:grid;gap:8px}
.wc{border:1.5px solid var(--line);border-left:6px solid var(--k);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--card);text-align:left;width:100%}
.wc.on{border-color:var(--hl);border-left-color:var(--k);box-shadow:0 0 0 2px var(--hl) inset}
.wc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wid{font:600 13px var(--f-mono);background:var(--bg);border-radius:5px;padding:1px 7px}
.wcount{font-size:20px;font-weight:700;line-height:1}
.wcount small{font-size:13px;font-weight:600;color:var(--mute);margin-left:2px}
.wlen{font:500 12px var(--f-mono);color:var(--mute);margin-left:auto}
.wroute{font-size:14px;font-weight:600}
.cores{display:flex;flex-wrap:wrap;gap:5px}
.core{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px 1px 4px;background:var(--bg)}
.core i{width:12px;height:12px;border-radius:3px;background:var(--a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.core i.two{background:linear-gradient(135deg,var(--a) 0 55%,var(--b) 55%)}
.wnote{font-size:12.5px;color:var(--mute)}
.wends{display:flex;flex-wrap:wrap;gap:6px}
.endbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;min-height:32px}

/* 하위 탭 */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500;min-height:36px}
.sbtn[aria-selected="true"]{background:var(--card);border-color:var(--c,var(--ink));box-shadow:0 0 0 1px var(--c,var(--ink)) inset}
.sub{display:grid;gap:12px;min-width:0}
.fig{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.fig-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.scroll{overflow-x:auto}
.tag{display:inline-block;font:600 11px var(--f-mono);padding:1px 7px;border-radius:5px;border:1px solid var(--line-strong);color:var(--mute);white-space:nowrap}
.tag.ours{border-color:var(--ours);color:var(--ours)}

/* 함체 도면 */
.encsvg text{font-family:var(--f-body)}
.e-out{fill:var(--card);stroke:var(--ink);stroke-width:2}
.e-in{fill:none;stroke:var(--line-strong);stroke-dasharray:4 3}
.e-pcb{fill:var(--pcb);stroke:var(--ink)}
.e-mod{fill:#2A2F35;stroke:var(--ink)}
.e-relay{fill:var(--relay);stroke:var(--ink)}
.e-hub{fill:var(--hub);stroke:var(--ink)}
.e-tb{fill:var(--wy);stroke:var(--ink)}
.e-lab{fill:#FFFFFF;font-size:12px;font-weight:700}
.e-lab2{fill:#FFFFFF;font-size:9.5px}
.e-dim{stroke:var(--mute);stroke-width:1}
.e-dimt{fill:var(--mute);font:600 11px var(--f-mono)}
.e-gl{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.e-glt{fill:var(--ink);font:600 9.5px var(--f-mono)}
.e-note{fill:var(--mute);font-size:11px}
.e-vent{stroke:var(--line-strong);stroke-width:3;stroke-linecap:round}
.req{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.req > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.req ul{margin:0;padding-left:18px;font-size:14px}
.parts-t td,.parts-t th{font-size:13px}

/* OCU 뒷면 */
.port rect,.port circle{stroke-width:1.5}
.port text{font:600 10px var(--f-mono);text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.p-har rect{fill:var(--wr2);stroke:var(--wr)}
.p-pc rect{fill:var(--ours-bg);stroke:var(--ours)}
.p-os rect{fill:var(--card);stroke:var(--w4)}
.p-etc rect,.p-etc circle{fill:var(--car);stroke:var(--line-strong)}
.p-etc text{fill:var(--mute)}
.panel-bg{fill:var(--car-2);stroke:var(--line-strong);stroke-width:1.5}
.callout{font:600 12px var(--f-body)}
.ph-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ph{margin:0;display:grid;gap:4px;align-content:start;min-width:0}
.ph img{display:block;width:100%;height:auto;max-width:100%;border-radius:8px;border:1px solid var(--line)}
.ph figcaption{font-size:12.5px;color:var(--mute)}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.rowbtn{cursor:pointer}
.rowbtn:hover td{background:var(--bg)}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.team > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.team ul{margin:0;padding-left:18px;font-size:14px}
.team .ours{background:var(--ours-bg);border-color:transparent}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.photo{border:1.5px dashed var(--line-strong);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.photo input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.open-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.open-list > div{border:1.5px dashed var(--tbd);border-radius:10px;padding:10px 12px}
.open-list b{display:block}
.open-list span{font-size:13px;color:var(--mute)}
.reset{font-size:13px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
footer{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--mute);display:grid;gap:4px}


.bp-tabs{display:flex;gap:6px;flex-wrap:wrap}
.bp-btn{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;min-height:36px;cursor:pointer}
.bp-btn[aria-selected="true"]{background:var(--ink);color:var(--card,var(--surface));border-color:var(--ink)}
.bp-body{display:grid;gap:10px;margin-top:10px}
.bp-scroll{overflow-x:auto}
.bp-body svg{display:block;width:100%!important;height:auto!important;max-width:900px!important;max-height:none!important;margin:0 auto}
.bp-sub{font-size:13px;color:var(--mute,var(--muted));margin:0}
.bp-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.bp-key i{display:inline-block;width:16px;height:5px;border-radius:2px;margin-right:6px;vertical-align:middle}
.bp-rel{font-size:13.5px;font-weight:600;border-left:4px solid #1f5fa8;padding-left:10px;margin:0}
@media (max-width:820px){ .d-cols,.team{grid-template-columns:1fr} }
@media (max-width:560px){
  .stagebox{padding:8px;border-radius:12px}
  .stage{height:330px}
  .d-head,.d-body{padding-left:14px;padding-right:14px}
  .vbtn{padding:5px 10px}
  .selbar{right:56px}
  .stage .hint{display:none}
}
@media print{
  body{background:#fff;padding:0}
  .stagebox,.chips,.subtabs,.reset{display:none!important}
  .sub[hidden]{display:grid!important}
}
</style>

<header class="top wrap">
  <div class="t">
    <div class="eyebrow">작업지시서 · v0.6 · 2026-10-30</div>
    <h1>PCS 차량 작업지시서</h1>
  </div>
  <div class="meta">
    <span><b>차량</b>KGM 토레스 EVX × 2대</span>
    <span><b>작업 일정</b><span class="blank"></span></span>
    <span><b>현장 연락</b><span class="blank"></span></span>
  </div>
</header>

<main class="wrap" id="app">
  <div class="stagebox" id="stagebox">
    <div class="toolbar" id="views">
      <button type="button" class="vbtn" data-view="all" aria-pressed="true">전체</button>
      <button type="button" class="vbtn" data-view="top" aria-pressed="false">위에서</button>
      <button type="button" class="vbtn" data-view="side" aria-pressed="false">오른쪽</button>
      <button type="button" class="vbtn" data-view="front" aria-pressed="false">1열</button>
      <button type="button" class="vbtn" data-view="trunk" aria-pressed="false">트렁크</button>
      <span class="sp"></span>
      <button type="button" class="vbtn" id="vLbl" aria-pressed="true">번호 표시</button>
      <button type="button" class="vbtn" data-pick="all">선택 해제</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="차량 3D 배치도. 부품을 누르면 아래에 작업 내용이 나옵니다."></canvas>
      <div class="selbar" id="selbar"></div>
      <div class="zoom"><button type="button" data-zoom="0.8" aria-label="확대">+</button><button type="button" data-zoom="1.25" aria-label="축소">−</button></div>
      <span class="hint">부품을 누르면 아래에 할 일이 나옵니다 · 드래그 회전 · 휠 확대 · 우클릭 드래그 이동</span>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="fallback2d" id="fb2d"></div>
    <div class="chips" id="chips"></div>
  </div>

  <section class="detail" id="detail" aria-live="polite"></section>

  <footer>
    <span>참고 자료: 효림XE「OCU_MAIN 개발용 하네스 V0.1 (특장업체 전달용)」, 효림XE OCU 케이블 연결 가이드 메일</span>
    <span>OCU 관련 문의는 아이콘엑스를 통해 효림XE에 전달합니다. 치수와 위치 중 "약", "?" 표시는 현장에서 함께 확정합니다.</span>
  </footer>
</main>

  function mountTpl(id){
    var host=$('#tplhost'), t=document.getElementById(id);

    $$('[data-ck]',host).forEach(function(list){

      $$('input[type=checkbox]',list).forEach(function(cb,i){

  function bindChecks(root){

  }

          break;
        case 'avn':
          at(rbox(w,h,d,8,M(0x111214,.2,.3)),cx,cy,cz);
          at(B(2,h*.82,d*.9,M(0x0b2135,.15,.2,{emissive:0x113a63,emissiveIntensity:.6})),b[1]+1,cy,cz);
          break;
        case 'gnd':
          at(C(14,30,M(0xc0c4c8,.3,.9),16),cx,cy,cz);at(C(26,4,M(0xb87333,.35,1),20),cx,b[3],cz);
          break;
        case 'fuse':
          at(rbox(w,h,d,8,M(0x3b3f45,.6,.1,op)),cx,cy,cz);
          for(var f2=0;f2<4;f2++)at(B(4,h*.6,8,M(0xe0c060,.5,0,op)),b[0]-2,cy,b[4]+30+f2*40);
          break;
        case 'cgw':
          at(rbox(w,h,d,6,M(0x1d1f22,.5,.1,op)),cx,cy,cz);at(B(w*.5,h*.4,8,M(0xe8e0c8,.6,0,op)),cx,cy,b[5]+4);
          break;
        default:
          at(rbox(w,h,d,6,M(0x2b2e33,.5,0,op)),cx,cy,cz);
      }
      scene.add(g);return g;
    }

    function labelPos(g){var bx=new T.Box3().setFromObject(g),c=bx.getCenter(new T.Vector3());return [c.x,bx.max.y+150,c.z];}
    PARTS.forEach(function(p){
      var g=partGroup(p);groups[p.id]=g;picks.push(g);
      var tok=G[p.g].c, txt=p.n?String(p.n):p.u, round=!!p.n;
      var tn=tex(txt+(p.est&&!p.n?'?':''),'#ffffff',css(tok),round), th=tex(txt+(p.est&&!p.n?'?':''),'#ffffff',css(tok),round,'#f2b705');
      var s=sprite(tn,p.n?.036:.03),lp=labelPos(g);s.position.set(lp[0],lp[1],lp[2]);s.userData.key='part:'+p.id;
      sprs[p.id]={s:s,n:tn,h:th};picks.push(s);
    });

    /* 선 */
    var WCOL={sig:0x1c7ed6,pwr:0xe03131,gnd:0x2b2f33,net:0x7048e8,usb:0x4b5563,tbd:0x8794a1,y:0xe8b10e,k:0x1e1e1e,r:0xd9362b,b:0x2463d1};
    function fillet(pts,r){
      var q=pts.map(function(p){return new T.Vector3(p[0],p[1],p[2]);}),path=new T.CurvePath(),prev=q[0];
      for(var i=1;i<q.length-1;i++){var a=q[i].clone().sub(q[i-1]),b2=q[i+1].clone().sub(q[i]),la=a.length(),lb=b2.length();a.normalize();b2.normalize();
        if(a.dot(b2)>.999)continue;var rr=Math.min(r,la/2,lb/2),p1=q[i].clone().addScaledVector(a,-rr),p2=q[i].clone().addScaledVector(b2,rr);
        if(p1.distanceTo(prev)>1)path.add(new T.LineCurve3(prev.clone(),p1));path.add(new T.QuadraticBezierCurve3(p1,q[i].clone(),p2));prev=p2;}
      path.add(new T.LineCurve3(prev.clone(),q[q.length-1].clone()));return path;
    }
    WIRES.forEach(function(w){
      if(!w.p) return;
      var R=w.k==='y'||w.k==='k'?17:w.k==='net'?11:12;
      var m=new T.Mesh(new T.TubeGeometry(fillet(w.p,80),Math.max(40,w.p.length*24),R,8,false),
        M(WCOL[w.k],.4,0,{transparent:true,opacity:w.k==='tbd'?.55:1}));
      m.castShadow=true;m.userData.key='wire:'+w.id;m.userData.op=w.k==='tbd'?.55:1;scene.add(m);wm[w.id]=m;picks.push(m);
    });

    /* 선택 표시 */
    var helper=new T.BoxHelper(undefined,0xf2b705);helper.material.depthTest=false;helper.renderOrder=15;helper.visible=false;scene.add(helper);
    var helperObj=null;
    function setEm(g,on){g.traverse(function(o){if(!o.isMesh||!o.material.emissive)return;
      if(o.userData.em0==null){o.userData.em0=o.material.emissive.getHex();o.userData.ei0=o.material.emissiveIntensity;}
      if(on){o.material.emissive.setHex(0x3a2b00);o.material.emissiveIntensity=1;}else{o.material.emissive.setHex(o.userData.em0);o.material.emissiveIntensity=o.userData.ei0;}});}
    function apply(){
      var r=relSet();
      Object.keys(wm).forEach(function(id){var m=wm[id],lit=!r||r.wires[id];m.material.opacity=lit?m.userData.op:.1;m.material.depthWrite=!!lit;});
      Object.keys(groups).forEach(function(id){setEm(groups[id],sel.k==='part'&&sel.id===id&&id!=='enc');
        var s=sprs[id],main=sel.k==='part'&&sel.id===id;s.s.material.map=main?s.h:s.n;s.s.material.opacity=(!r||r.parts[id])?1:.35;s.s.material.needsUpdate=true;});
      var open=sel.k==='part'&&sel.id==='enc';
      if(encShell){encShell.material.opacity=open?.16:1;encShell.material.depthWrite=!open;encShell.castShadow=!open;encLid.visible=!open;sprs.enc.s.visible=!open;encLabels.forEach(function(l){l.visible=open;});}
      helperObj=sel.k==='part'?groups[sel.id]:sel.k==='wire'?wm[sel.id]:null;
      helper.visible=!!helperObj&&!open; if(helperObj) helper.setFromObject(helperObj);
    }

    /* 카메라 */
    function off(th,ph,r){return [r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph),r*Math.sin(ph)*Math.cos(th)];}
    var VIEWS={all:{t:[2450,700,0],o:off(2.25,1.0,7600)},top:{t:[2400,600,0],o:[0,9000,1]},side:{t:[2400,850,0],o:off(Math.PI,1.42,7000)},
      front:{t:[1700,700,-150],o:off(2.55,.85,3800)},trunk:{t:[3900,750,0],o:off(1.95,.75,3800)}};
    var tw=null, reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function fly(pos,tgt){tw={t0:performance.now(),p0:cam.position.clone(),q0:ctl.target.clone(),p1:new T.Vector3(pos[0],pos[1],pos[2]),q1:new T.Vector3(tgt[0],tgt[1],tgt[2])};
      if(reduce){cam.position.copy(tw.p1);ctl.target.copy(tw.q1);tw=null;}}
    function tween(){if(!tw)return;var k=Math.min(1,(performance.now()-tw.t0)/600),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      cam.position.lerpVectors(tw.p0,tw.p1,e);ctl.target.lerpVectors(tw.q0,tw.q1,e);if(k>=1)tw=null;}
    function pressed(name){$$('#views [data-view]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-view')===name?'true':'false');});}
    function view(name){var v=VIEWS[name],k=Math.max(1,1.5/cam.aspect);pressed(name);fly([v.t[0]+v.o[0]*k,v.t[1]+v.o[1]*k,v.t[2]+v.o[2]*k],v.t);}
    function focusObj(o,minD){var bx=new T.Box3().setFromObject(o),c=bx.getCenter(new T.Vector3()),s=bx.getSize(new T.Vector3()).length(),
      dir=cam.position.clone().sub(ctl.target).normalize();if(dir.y<.5){dir.y=.65;dir.normalize();}
      var dist=Math.max(minD||900,s*1.9)*Math.max(1,1.3/cam.aspect);pressed(null);fly([c.x+dir.x*dist,c.y+dir.y*dist,c.z+dir.z*dist],[c.x,c.y,c.z]);}
    function focus(){
      if(sel.k==='all'){view('all');return;}
      if(sel.k==='part'){var g=groups[sel.id];if(sel.id==='enc'){var c=new T.Box3().setFromObject(g).getCenter(new T.Vector3());pressed(null);fly([c.x+230,c.y+560,c.z-260],[c.x,c.y,c.z]);return;}
        focusObj(g,sel.id==='film'||sel.id==='led'?1800:p0(sel.id)?1700:1300);return;}
      focusObj(wm[sel.id],1400);
    }
    function p0(id){return id==='ocu'||PBY[id].g==='car';}
    function zoom(f){var o=cam.position.clone().sub(ctl.target).multiplyScalar(f),L=o.length();if(L<ctl.minDistance||L>ctl.maxDistance)return;cam.position.copy(ctl.target).add(o);}

    /* 누르기 · 마우스 올리기 */
    var ray=new T.Raycaster(),nd=new T.Vector2(),down=null,tip=$('#tip');
    function hit(e){
      var rc=cv.getBoundingClientRect();nd.set((e.clientX-rc.left)/rc.width*2-1,-(e.clientY-rc.top)/rc.height*2+1);ray.setFromCamera(nd,cam);
      var hs=ray.intersectObjects(picks,true);
      for(var i=0;i<hs.length;i++){var o=hs[i].object;
        if(o.isMesh&&o.material.transparent&&o.material.opacity<.3&&!(sel.k==='part'&&sel.id==='enc'))continue;
        while(o&&!o.userData.key)o=o.parent;if(o)return o.userData.key.split(':');}
      return null;
    }
    cv.addEventListener('pointerdown',function(e){down=[e.clientX,e.clientY,e.button];});
    cv.addEventListener('pointerup',function(e){
      if(!down)return;var dx=e.clientX-down[0],dy=e.clientY-down[1],btn=down[2];down=null;
      if(btn!==0||dx*dx+dy*dy>36)return;var k=hit(e);
      if(!k){select('all');return;}
      if(k[0]==='part')select('part',k[1],{focus:1});else select('wire',k[1],{focus:1});
    });
    var lastMv=0;
    cv.addEventListener('pointermove',function(e){
      if(e.pointerType!=='mouse'||down)return;var now=performance.now();if(now-lastMv<70)return;lastMv=now;
      var k=hit(e),txt='';
      if(k&&k[0]==='part'){var p=PBY[k[1]];txt=label(p)+(p.where?' · '+p.where:'');}
      else if(k&&k[0]==='wire'){var w=WBY[k[1]];txt=w.id+' · '+(w.n?w.n+(w.u||'가닥')+' ':'')+w.t+' · '+PBY[w.f].t+' → '+PBY[w.to].t;}
      if(txt){var rc=stage.getBoundingClientRect();tip.hidden=false;tip.textContent=txt;tip.style.left=Math.min(e.clientX-rc.left+14,rc.width-280)+'px';tip.style.top=(e.clientY-rc.top+14)+'px';cv.style.cursor='pointer';}
      else{tip.hidden=true;cv.style.cursor='';}
    });
    cv.addEventListener('pointerleave',function(){tip.hidden=true;});
    cv.addEventListener('contextmenu',function(e){e.preventDefault();});
    $$('#views [data-view]').forEach(function(b){b.addEventListener('click',function(){view(b.getAttribute('data-view'));});});
    $$('.zoom button').forEach(function(b){b.addEventListener('click',function(){zoom(+b.getAttribute('data-zoom'));});});
    var lb=$('#vLbl');if(lb)lb.addEventListener('click',function(){var on=lb.getAttribute('aria-pressed')!=='true';lb.setAttribute('aria-pressed',on?'true':'false');Object.keys(sprs).forEach(function(id){sprs[id].s.visible=on&&!(id==='enc'&&sel.k==='part'&&sel.id==='enc');});});

    function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
    if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
    resize();
    var v0=VIEWS.all,k0=Math.max(1,1.5/cam.aspect);cam.position.set(v0.t[0]+v0.o[0]*k0,v0.t[1]+v0.o[1]*k0,v0.t[2]+v0.o[2]*k0);ctl.target.set(v0.t[0],v0.t[1],v0.t[2]);
    hooks.push(function(s,o){apply();if(o.focus)focus();});
    apply();
    (function loop(){requestAnimationFrame(loop);tween();ctl.update();if(helper.visible&&helperObj)helper.setFromObject(helperObj);ren.render(scene,cam);})();
  }

  select('all');
  try{init3d();}catch(e){fallback2d();}
})();
</script>
